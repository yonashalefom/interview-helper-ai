<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Cheat Interviews</title>
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="main-container">
    <!--    region Shortcuts Bar-->
    <div style="display: flex; justify-content: space-between">
        <div style="display: flex; gap: 10px; flex-direction: row; padding-bottom: 10px">
            <button id="record" class="shortcut-button">
                <div style="display: flex; gap: 5px; flex-direction: row; align-items: center; justify-content: center;">
                    <svg preserveAspectRatio="none" id="visualizer" version="1.1" xmlns="http://www.w3.org/2000/svg"
                         xmlns:xlink="http://www.w3.org/1999/xlink">
                        <defs>
                            <mask id="mask">
                                <g id="maskGroup">
                                </g>
                            </mask>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#ff0a0a;stop-opacity:1"/>
                                <stop offset="20%" style="stop-color:#f1ff0a;stop-opacity:1"/>
                                <stop offset="90%" style="stop-color:#d923b9;stop-opacity:1"/>
                                <stop offset="100%" style="stop-color:#050d61;stop-opacity:1"/>
                            </linearGradient>
                        </defs>
                        <rect x="0" y="0" width="100%" height="100%" fill="url(#gradient)" mask="url(#mask)"></rect>
                    </svg>
                    <div>
                        <span class="start-recording-text">Start Recording</span>
                        <span class="shortcut-hint">Ctrl + 2</span>
                    </div>

                </div>
            </button>
            <button id="stoprecord" class="shortcut-button">
                Stop Recording
                <span class="shortcut-hint">Ctrl + 3</span>
            </button>
            <button class="shortcut-button">
                Hide/Unhide
                <span class="shortcut-hint">Ctrl + 4</span>
            </button>
        </div>
        <!--        <div id="window-dagger" class="drag-handler" >-->

        <!--        </div>-->
    </div>
    <!--    endregion -->


    <div class="bottom-bar-container">
        <div class="bottom-bar-section">
            <p class="section-title">Realtime Trans:</p>
            <div style="position: relative;">
            <textarea
                    class="transcribed-text"
                    id="captions"
                    rows="6"
                    style="resize: none; width: 100%; padding: 8px;"
            >

            </textarea>
<!--                <button-->
<!--                        id="sendTranscript"-->
<!--                        title="Send to LLM"-->
<!--                >-->
<!--                    <i class="fas fa-paper-plane"></i>-->
<!--                </button>-->
                <button id="sendTranscript" class="shortcut-button">
                    Send
                    <span class="shortcut-hint">Ctrl + 9</span>
                </button>
            </div>
        </div>
        <div class="bottom-bar-section">
            <p class="section-title">LLM Response:</p>
            <div class="llm-response" id="llmResponse"></div>
        </div>
    </div>
</div>

<!--<script src="animation.js"></script>-->
<script src="client.js"></script>
<!--<script src="renderer.js"></script>-->
</body>
</html>
